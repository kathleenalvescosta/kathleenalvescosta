<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <link rel="stylesheet" href="https://use.typekit.net/xms5iol.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fafaf8;
      color: #333;
      font-family: "adobe-caslon-pro", serif;
    }

    /* Header at top */
    #header {
      background-color: #fafaf8;
      padding: 10px 0;
      text-align: center;
    }

    #header h1 {
      font-size: 48px;
      margin: 0;
      color: black;
      font-style: italic;
      font-weight: 400;
    }

    #nav-links {
      margin-top: 5px;
    }

    #nav-links a {
      margin: 0 15px;
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-style: italic;
      font-family: "adobe-caslon-pro", serif;
    }

    /* Main content centered */
    #coming-soon {
      height: calc(100vh - 100px); /* account for header height */
      display: flex;
      flex-direction: column;
      justify-content: center;     
      align-items: center;         
      text-align: center;
      font-family: "adobe-caslon-pro", serif;
      font-style: italic;          
    }

    #coming-soon h1 {
      margin: 0;
      font-size: 36px;
    }

    #text {
      margin-top: 10px;
      font-size: 14px;
      font-style: normal;
    }

  </style>
</head>
<body>
  <div id="header">
    <h1>Kathleen Alves Costa</h1>
    <div id="nav-links">
      <a href="index.html">About</a>
      <a href="project.html">Projects</a>
      <a href="contact.html">CV</a>
    </div>
 
    <hr>

  <div id="coming-soon">
    <h1>Coming Soon!</h1>
    <div id="text">
      <p>Thanks for visiting my site :)</p>
    </div>
  </div>
</body>
</html>
